[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textorigin-humanizer"
version = "0.2.0"
description = "Local-first text-origin analysis and guarded English rewriting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.13.0",
  "transformers==5.14.1",
  "numpy==1.26.2",
  "fastapi==0.141.1",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "sentence-transformers==5.6.1",
  "requests==2.32.5",
]

[project.optional-dependencies]
training = [
  "datasets==5.0.1",
  "scikit-learn==1.8.0",
  "pandas==2.1.3",
  "tqdm==4.67.3",
  "sentencepiece==0.2.2",
  "accelerate==1.14.0",
]
dev = ["pytest==9.0.2", "httpx==0.28.1", "build>=1.2"]

[project.scripts]
humanizer = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
